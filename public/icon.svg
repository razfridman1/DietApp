<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- App icon background (rounded square) -->
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <!-- subtle top sheen -->
    <ellipse cx="256" cy="40" rx="360" ry="120" fill="#ffffff" opacity="0.10"/>
    <!-- subtle bottom curve -->
    <ellipse cx="256" cy="560" rx="360" ry="180" fill="#0c4a6e" opacity="0.18"/>
  </g>

  <!-- Dumbbell drop shadow -->
  <g transform="translate(0,12)" opacity="0.30">
    <rect x="46"  y="220" width="32"  height="80"  rx="10" fill="#0c4a6e"/>
    <rect x="76"  y="200" width="50"  height="120" rx="14" fill="#0c4a6e"/>
    <rect x="386" y="200" width="50"  height="120" rx="14" fill="#0c4a6e"/>
    <rect x="434" y="220" width="32"  height="80"  rx="10" fill="#0c4a6e"/>
    <rect x="120" y="240" width="272" height="40"  rx="14" fill="#0c4a6e"/>
  </g>

  <!-- Dumbbell -->
  <g stroke="#0c4a6e" stroke-width="6" stroke-linejoin="round">
    <rect x="46"  y="220" width="32"  height="80"  rx="10" fill="url(#metal)"/>
    <rect x="76"  y="200" width="50"  height="120" rx="14" fill="url(#metal)"/>
    <rect x="120" y="240" width="272" height="40"  rx="14" fill="url(#metal)"/>
    <rect x="386" y="200" width="50"  height="120" rx="14" fill="url(#metal)"/>
    <rect x="434" y="220" width="32"  height="80"  rx="10" fill="url(#metal)"/>
  </g>

  <!-- Bar grip lines -->
  <g stroke="#0c4a6e" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="170" y1="252" x2="170" y2="268"/>
    <line x1="195" y1="252" x2="195" y2="268"/>
    <line x1="220" y1="252" x2="220" y2="268"/>
    <line x1="245" y1="252" x2="245" y2="268"/>
    <line x1="270" y1="252" x2="270" y2="268"/>
    <line x1="295" y1="252" x2="295" y2="268"/>
    <line x1="320" y1="252" x2="320" y2="268"/>
    <line x1="345" y1="252" x2="345" y2="268"/>
  </g>

  <!-- Plate centers -->
  <circle cx="101" cy="260" r="7" fill="#0c4a6e"/>
  <circle cx="411" cy="260" r="7" fill="#0c4a6e"/>

  <!-- Spark / AI accent -->
  <g transform="translate(380,120)" fill="#fde68a" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round">
    <path d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8 Z"/>
  </g>
  <g transform="translate(120,400)" fill="#fde68a" opacity="0.85">
    <circle r="6"/>
  </g>
  <g transform="translate(420,420)" fill="#fde68a" opacity="0.85">
    <circle r="4"/>
  </g>
</svg>
